name: Cursor code review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  cursor-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Cursor CLI
        # example install; replace with Cursor's latest install command if changed
        run: |
          curl https://cursor.com/install -fsS | bash
          cursor --version || true

      - name: Run Cursor code review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # example: run a review on current PR including the diff
          # replace with the exact Cursor CLI command from your docs if different
          cursor review --pr "${{ github.event.pull_request.number }}" --with-diff --report-type=comment
