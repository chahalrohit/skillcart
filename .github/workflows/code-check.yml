name: Code Quality Check

on:
  push:
    branches: [ main, master, develop, rohit-dev ]
  pull_request:
    branches: [ main, master, develop, rohit-dev ]

jobs:
  code-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run code checks (lint + type-check)
        run: npm run check
      
      - name: Check for build errors
        run: npx expo export --platform web --clear || echo "Build check completed"

